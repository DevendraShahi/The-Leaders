name: Update News Automatically

on:
  schedule:
    # Runs every 4 hours. You can adjust this cron schedule as needed.
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  fetch-and-update-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run News Fetcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Assuming ts-node or similar is used to execute the script. 
        # You may need to add it to your devDependencies or use npx tsx.
        run: npx tsx scripts/fetch-news.ts
