<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cricket Studio · Redesigned coverage templates</title><link rel="stylesheet" href="guide.css"><script src="data.js"></script><style>body{padding:35px;max-width:1600px;margin:auto}.gallery-head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--ink);padding-bottom:22px;margin-bottom:22px}.gallery-head h1{font:42px/1.1 Georgia,serif;margin:9px 0}.gallery-head p{font-size:12px;color:var(--muted)}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 22px;margin:28px 0}.gallery a{text-decoration:none;min-width:0}.gallery img{width:100%;height:auto;display:block}.gallery h2{font-size:12px;margin:10px 0 3px}.gallery p{font-size:9px;color:var(--muted);margin:0}@media(max-width:800px){body{padding:20px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}.gallery-head h1{font-size:29px}.gallery-head{display:block}}</style></head><body><header class="gallery-head"><div><span class="eyebrow">THE LEADERS / STUDIO</span><h1>The remaining coverage collection.</h1><p>16 redesigned templates, including all three Player of the Match modes.</p></div><a href="index.html">Open the editor field guide ↗</a></header><div class="training"><b>TRAINING DATA</b><span>Real artwork layouts. Illustrative figures and announcements; replace before publishing.</span></div><main class="gallery" id="gallery"></main><script>const ids=new Set(['innings','target','dls','rain','fifty','century','batting','bowling','five-for','hat-trick','player-of-match','result','scorecard','points-table','qualified','champions','player-of-match-bowling','player-of-match-all-round']); for(const example of window.STUDIO_GUIDE_DATA.examples.filter(item=>ids.has(item.id))){const link=document.createElement('a');link.href='index.html#'+example.id;const img=document.createElement('img');img.src='previews/'+example.id+'.jpg';img.alt='Illustrative '+example.title;const heading=document.createElement('h2');heading.textContent=example.title;const note=document.createElement('p');note.textContent='View field names and section map ↗';link.append(img,heading,note);document.getElementById('gallery').append(link);}</script></body></html>
